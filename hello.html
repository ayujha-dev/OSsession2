<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Neon Horizon</title>
	<style>
		:root { --cyan: #62f5ff; --pink: #ff4ecd; --ink: #090b1a; }
		* { box-sizing: border-box; }
		body {
			margin: 0; min-height: 100vh; overflow: hidden; color: white;
			font-family: Inter, system-ui, sans-serif; background: var(--ink);
			display: grid; place-items: center;
		}
		.scene { position: relative; width: min(1100px, 100%); min-height: 100vh; padding: 8vh 8vw; overflow: hidden; }
		.orb { position: absolute; width: 420px; height: 420px; border-radius: 50%;
			background: radial-gradient(circle at 35% 30%, #fff 0 2%, var(--cyan) 7%, #5d36ff 35%, transparent 70%);
			filter: blur(8px); opacity: .8; top: 5%; right: 4%; animation: float 8s ease-in-out infinite; }
		.grid { position: absolute; inset: 55% -20% -20%; transform: perspective(350px) rotateX(58deg);
			background: linear-gradient(#ffffff1c 1px, transparent 1px), linear-gradient(90deg, #ffffff1c 1px, transparent 1px);
			background-size: 48px 48px; mask-image: linear-gradient(transparent, #000 30%); }
		nav { position: relative; display: flex; justify-content: space-between; align-items: center; }
		.logo { color: var(--cyan); font-weight: 800; letter-spacing: .2em; }
		nav a { color: #cbd0e8; text-decoration: none; margin-left: 2rem; font-size: .85rem; }
		main { position: relative; max-width: 650px; margin-top: 17vh; }
		.eyebrow { color: var(--pink); letter-spacing: .35em; text-transform: uppercase; font-size: .75rem; }
		h1 { margin: .5rem 0 1.2rem; font-size: clamp(3.5rem, 10vw, 8rem); line-height: .88; letter-spacing: -.08em;
			background: linear-gradient(100deg, #fff 20%, var(--cyan), var(--pink)); -webkit-background-clip: text; color: transparent; }
		p { max-width: 430px; color: #aeb5d2; line-height: 1.7; }
		button { margin-top: 1.5rem; padding: 1rem 1.5rem; border: 1px solid var(--cyan); border-radius: 999px;
			color: var(--ink); background: var(--cyan); font-weight: 800; cursor: pointer; box-shadow: 0 0 30px #62f5ff66; }
		button:hover { background: white; transform: translateY(-2px); }
		@keyframes float { 50% { transform: translate(-25px, 25px) scale(1.08); } }
	</style>
</head>
<body>
	<div class="scene">
		<div class="orb"></div><div class="grid"></div>
		<nav><div class="logo">N/H</div><div><a href="#explore">Explore</a><a href="#about">About</a></div></nav>
		<main id="explore">
			<div class="eyebrow">A new digital atmosphere</div>
			<h1>Dream<br />beyond.</h1>
			<p>Step into a brighter kind of future—where bold ideas glow, move, and become real.</p>
			<button onclick="this.textContent = 'Welcome aboard ✦'">Enter the horizon&nbsp; →</button>
		</main>
	</div>
</body>
</html>
